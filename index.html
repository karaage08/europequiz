<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EUROPE MASTER QUIZ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Arial","Yu Gothic",sans-serif;
}

body{
background:#f7f7f7;
padding:10px;
color:#333;
}

.screen{
display:none;
}

.screen.active{
display:block;
}

.card{
max-width:900px;
margin:auto;
background:white;
border-radius:24px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
margin-bottom:10px;
color:#2b7de9;
}

.subtitle{
text-align:center;
margin-bottom:20px;
color:#666;
}

.modeArea{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:30px 0;
}

.modeArea label{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;

background:#f5f5f5;

padding:15px;

border-radius:12px;

font-size:1rem;

font-weight:bold;

cursor:pointer;

min-height:90px;
}

.modeArea input[type="radio"]{
display:none;
}

.modeArea label:has(input:checked){
background:#2b7de9;
color:white;
}


.startBtn{
width:100%;
padding:18px;
font-size:1.3rem;
background:#2b7de9;
color:white;
border:none;
border-radius:16px;
cursor:pointer;
font-weight:bold;
}

.startBtn:hover{
background:#1565c0;
}

.bestRecord{
font-size:1.1rem;
font-weight:bold;
color:#2b7de9;
margin-top:20px;
line-height:1.8;
padding:15px;
background:#eef6ff;
border-radius:12px;
}

.infoBar{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.infoItem{
background:#eef6ff;
padding:10px 18px;
border-radius:12px;
font-weight:bold;
}

.questionBox{
text-align:center;
margin-bottom:15px;
}

.questionText{
font-size:1.6rem;
font-weight:bold;
color:#444;
}

.mapContainer{
text-align:center;
margin-bottom:20px;
}

.mapContainer img{
width:100%;
max-width:600px;
border-radius:16px;
border:3px solid #ddd;
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.answerBtn{
padding:15px;
font-size:1rem;
border:none;
border-radius:14px;
cursor:pointer;
background:#1cb0f6;
color:white;
font-weight:bold;
}

.answerBtn:hover{
transform:scale(1.03);
}

.hintBtn{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#ffd54f;
font-weight:bold;
cursor:pointer;
}

.feedback{
margin-top:15px;
text-align:center;
font-size:1.3rem;
font-weight:bold;
min-height:40px;
}

.correct{
color:#58cc02;
}

.wrong{
color:#ff4b4b;
}

.hint{
margin-top:10px;
padding:15px;
background:#fff8dd;
border-radius:12px;
display:none;
}

.resultBox{
text-align:center;
}

.resultBox h2{
color:#2b7de9;
margin-bottom:20px;
}

.resultBox p{
font-size:1.2rem;
margin:10px 0;
}

.mistakes{
margin-top:20px;
text-align:left;
max-height:300px;
overflow:auto;
background:#fafafa;
padding:15px;
border-radius:12px;
}

.buttonRow{
display:flex;
gap:10px;
margin-top:20px;
}

.buttonRow button{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-size:1rem;
cursor:pointer;
font-weight:bold;
}

.retryBtn{
background:#58cc02;
color:white;
}

.homeBtn{
background:#999;
color:white;
}

.submitGuide{
margin-top:20px;
padding:15px;
background:#eef6ff;
border-radius:12px;
font-size:.95rem;
}

@media(max-width:600px){

.questionText{
font-size:1.2rem;
}

.answers{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div id="startScreen" class="screen active">

<div class="card">

<h1>🌍 EUROPE MASTER QUIZ</h1>

<p class="subtitle">
ヨーロッパの国名と自然地理を楽しくマスターしよう！
</p>

<div class="modeArea">

<label>
<input
type="radio"
name="mode"
value="country_random"
checked>

🌍<br>
国名10問

</label>

<label>
<input
type="radio"
name="mode"
value="country_all">

🏆<br>
国名全18問

</label>

<label>
<input
type="radio"
name="mode"
value="geo_random">

🗻<br>
自然地理10問

</label>

<label>
<input
type="radio"
name="mode"
value="geo_all">

👑<br>
自然地理全12問

</label>

</div>

<div id="titleBest" class="bestRecord">
🏆 自己ベスト読込中...
</div>

<button
id="startBtn"
class="startBtn">
スタート！
</button>

</div>
</div>
<!-- ゲーム画面 -->

<div id="gameScreen" class="screen">

<div class="card">

<div class="infoBar">

<div class="infoItem">
問題
<span id="progress"></span>
</div>

<div class="infoItem">
正解
<span id="correctCount">0</span>
</div>

<div class="infoItem">
時間
<span id="timer">0</span>秒
</div>

</div>

<div class="questionBox">

<div
id="questionText"
class="questionText">
問題
</div>

</div>

<div class="mapContainer">
<img
src="europe_map.png"
alt="ヨーロッパ地図">
</div>


<div id="feedback" class="feedback"></div>

<div
id="answers"
class="answers">
</div>

<button
id="hintBtn"
class="hintBtn">
💡 ヒント
</button>

<div
id="hintBox"
class="hint">
</div>

</div>

</div>

<!-- 結果画面 -->

<div id="resultScreen" class="screen">

<div class="card">

<div class="resultBox">

<h2>🏆 RESULT</h2>

<div
id="rankBox"
class="bestRecord">
</div>

<p>
正解数：
<span id="resultCorrect"></span>
</p>

<p>
ミス数：
<span id="resultMiss"></span>
</p>

<p>
正答率：
<span id="resultRate"></span>%
</p>

<p>
タイム：
<span id="resultTime"></span>秒
</p>

<div
id="bestRecord"
class="bestRecord">
</div>

<div
id="mistakes"
class="mistakes">
</div>

<div class="buttonRow">

<button
id="retryBtn"
class="retryBtn">
もう一回！
</button>

<button
id="homeBtn"
class="homeBtn">
タイトルへ
</button>

</div>

<div class="submitGuide">

📸 スクリーンショットを撮って提出しましょう！<br>
Windows：Ctrl + □││キー

</div>

</div>

</div>

</div>

<script>

const countryQuestions = [

{id:"1",answer:"イギリス",hint:"グレートブリテン島を中心とする国",info:"首都：ロンドン"},
{id:"2",answer:"フランス",hint:"西ヨーロッパ最大級の農業国",info:"首都：パリ"},
{id:"3",answer:"スペイン",hint:"イベリア半島の大部分を占める",info:"首都：マドリード"},
{id:"4",answer:"ポルトガル",hint:"ヨーロッパ最西端付近の国",info:"首都：リスボン"},
{id:"5",answer:"アイルランド",hint:"イギリスの西側にある島国",info:"首都：ダブリン"},
{id:"6",answer:"ベルギー",hint:"EU本部が置かれている国",info:"首都：ブリュッセル"},
{id:"7",answer:"オランダ",hint:"干拓地が有名",info:"首都：アムステルダム"},
{id:"8",answer:"ドイツ",hint:"ヨーロッパ最大級の工業国",info:"首都：ベルリン"},
{id:"9",answer:"ポーランド",hint:"ドイツの東側",info:"首都：ワルシャワ"},
{id:"10",answer:"チェコ",hint:"首都はプラハ",info:"首都：プラハ"},
{id:"11",answer:"スイス",hint:"永世中立国として有名",info:"首都：ベルン"},
{id:"12",answer:"オーストリア",hint:"アルプス山脈が広がる",info:"首都：ウィーン"},
{id:"13",answer:"イタリア",hint:"長靴の形で有名",info:"首都：ローマ"},
{id:"14",answer:"ウクライナ",hint:"ヨーロッパ有数の穀倉地帯",info:"首都：キーウ"},
{id:"15",answer:"ギリシャ",hint:"古代文明発祥地のひとつ",info:"首都：アテネ"},
{id:"16",answer:"ノルウェー",hint:"フィヨルドで有名",info:"首都：オスロ"},
{id:"17",answer:"スウェーデン",hint:"北欧最大級の面積",info:"首都：ストックホルム"},
{id:"18",answer:"フィンランド",hint:"湖が多い国",info:"首都：ヘルシンキ"}

];

const geoQuestions = [

{id:"★1",answer:"イベリア半島",hint:"スペインとポルトガルがある半島",info:"ヨーロッパ南西部"},

{id:"★2",answer:"ピレネー山脈",hint:"スペインとフランスの国境",info:"半島との境界"},

{id:"★3",answer:"アルプス山脈",hint:"モンブランがある",info:"ヨーロッパ最大級の山脈"},

{id:"★4",answer:"セーヌ川",hint:"パリを流れる",info:"フランス北部"},

{id:"★5",answer:"ライン川",hint:"ドイツの工業地域",info:"国際河川"},

{id:"★6",answer:"エルベ川",hint:"チェコからドイツへ流れる",info:"北海へ注ぐ"},

{id:"★7",answer:"ドナウ川",hint:"ヨーロッパ第二の長さ",info:"黒海へ注ぐ"},

{id:"★8",answer:"地中海",hint:"南ヨーロッパの海",info:"重要な内海"},

{id:"★9",answer:"北海",hint:"イギリス東側",info:"油田で有名"},

{id:"★10",answer:"バルト海",hint:"スウェーデン南東",info:"塩分濃度が低い"},

{id:"★11",answer:"黒海",hint:"トルコ北側",info:"内海"},

{id:"★12",answer:"スカンディナビア半島",hint:"ノルウェーとスウェーデン",info:"ヨーロッパ北部"}

];

const startScreen =
document.getElementById("startScreen");

const gameScreen =
document.getElementById("gameScreen");

const resultScreen =
document.getElementById("resultScreen");

const startBtn =
document.getElementById("startBtn");

const retryBtn =
document.getElementById("retryBtn");

const homeBtn =
document.getElementById("homeBtn");

const progress =
document.getElementById("progress");

const questionText =
document.getElementById("questionText");

const answers =
document.getElementById("answers");

const correctCountEl =
document.getElementById("correctCount");

const timerEl =
document.getElementById("timer");

const feedback =
document.getElementById("feedback");

const hintBtn =
document.getElementById("hintBtn");

const hintBox =
document.getElementById("hintBox");

let questions = [];
let current = 0;
let correct = 0;
let mistakes = [];
let seconds = 0;
let timer;

function showTitleBest(){

const modes = [

["🌍 国名ランダム10問","europe_country_random"],
["🏆 国名全18問","europe_country_all"],
["🗻 自然地理ランダム10問","europe_geo_random"],
["👑 自然地理全12問","europe_geo_all"]

];

let html =
"<h3>🏆 自己ベスト</h3>";

modes.forEach(m=>{

const data =
JSON.parse(
localStorage.getItem(m[1])
);

if(data){

html += `
${m[0]}：正答率 ${data.rate}% 　タイム：${data.time}秒
<br>
`;

}else{

html += `
${m[0]}：未プレイ
<br>
`;

}

});

document.getElementById(
"titleBest"
).innerHTML = html;

}

function shuffle(array){

return [...array].sort(
()=>Math.random()-0.5
);

}

function startGame(){

window.currentMode =
document.querySelector(
'input[name="mode"]:checked'
).value;

const mode =
window.currentMode;

if(mode==="country_random"){

questions =
shuffle(
countryQuestions
).slice(0,10);

}
else if(mode==="country_all"){

questions =
shuffle(
countryQuestions
);

}
else if(mode==="geo_random"){

questions =
shuffle(
geoQuestions
).slice(0,10);

}
else{

questions =
shuffle(
geoQuestions
);

}

current = 0;
correct = 0;
mistakes = [];
seconds = 0;

correctCountEl.textContent = 0;
timerEl.textContent = 0;

clearInterval(timer);

timer = setInterval(()=>{

seconds++;
timerEl.textContent =
seconds;

},1000);

startScreen.classList.remove(
"active"
);

resultScreen.classList.remove(
"active"
);

gameScreen.classList.add(
"active"
);

showQuestion();

}

function showQuestion(){

const q =
questions[current];

progress.textContent =
`${current+1}/${questions.length}`;

questionText.textContent =
`${q.id} は何でしょう？`;

hintBox.style.display =
"none";

hintBox.textContent = "";

feedback.textContent = "";

const sourceData =
window.currentMode.startsWith(
"country"
)
?
countryQuestions
:
geoQuestions;

const choices =
shuffle(

sourceData.filter(
x => x.answer !== q.answer
)

).slice(0,3);

choices.push(q);

const finalChoices =
shuffle(choices);

answers.innerHTML = "";

finalChoices.forEach(choice=>{

const btn =
document.createElement(
"button"
);

btn.className =
"answerBtn";

btn.textContent =
choice.answer;

btn.onclick = ()=>{

checkAnswer(choice);

};

answers.appendChild(btn);

});

}

function checkAnswer(choice){

const q =
questions[current];

if(
choice.answer === q.answer
){

feedback.className =
"feedback correct";

feedback.textContent =
`⭕ 正解！ ${q.info}`;

correct++;

correctCountEl.textContent =
correct;

}
else{

feedback.className =
"feedback wrong";

feedback.textContent =
`❌ 不正解… 正解：${q.answer}`;

mistakes.push({

id:q.id,
your:choice.answer,
correct:q.answer

});

}

setTimeout(()=>{

current++;

if(
current >=
questions.length
){

finishGame();

}else{

showQuestion();

}

},1200);

}

function finishGame(){

clearInterval(timer);

gameScreen.classList.remove(
"active"
);

resultScreen.classList.add(
"active"
);

document.getElementById(
"resultCorrect"
).textContent = correct;

document.getElementById(
"resultMiss"
).textContent =
questions.length - correct;

document.getElementById(
"resultTime"
).textContent =
seconds;

const rate = Math.round(
correct /
questions.length *
100
);

document.getElementById(
"resultRate"
).textContent = rate;

let rank = "";

if(
window.currentMode.startsWith(
"country"
)
){

if(rate===100){
rank="🏆 ヨーロッパ王";
}
else if(rate>=90){
rank="👑 EUマスター";
}
else if(rate>=80){
rank="🥇 地理博士";
}
else if(rate>=70){
rank="🥈 地理上級者";
}
else if(rate>=60){
rank="🥉 地理中級者";
}
else{
rank="🌍 地理チャレンジャー";
}

}else{

if(rate===100){
rank="🏆 地形神";
}
else if(rate>=90){
rank="👑 自然地理マスター";
}
else if(rate>=80){
rank="🥇 ヨーロッパ探検家";
}
else if(rate>=70){
rank="🥈 フィールド研究員";
}
else if(rate>=60){
rank="🥉 地図好き";
}
else{
rank="🌱 見習い探検家";
}

}

document.getElementById(
"rankBox"
).innerHTML = rank;

/* 自己ベスト */

let saveKey = "";

switch(window.currentMode){

case "country_random":
saveKey =
"europe_country_random";
break;

case "country_all":
saveKey =
"europe_country_all";
break;

case "geo_random":
saveKey =
"europe_geo_random";
break;

case "geo_all":
saveKey =
"europe_geo_all";
break;

}

const currentRecord = {

rate:rate,
time:seconds

};

const bestRecord =
JSON.parse(
localStorage.getItem(
saveKey
)
);

let isNewRecord = false;

if(

!bestRecord ||

rate > bestRecord.rate ||

(
rate === bestRecord.rate &&
seconds < bestRecord.time
)

){

localStorage.setItem(

saveKey,

JSON.stringify(
currentRecord
)

);

isNewRecord = true;

}

const latest =
JSON.parse(
localStorage.getItem(
saveKey
)
);

let bestHtml = "";

if(isNewRecord){

bestHtml = `
🏆 NEW RECORD!
<br>
正答率 ${latest.rate}%
<br>
${latest.time}秒
`;

}else{

bestHtml = `
⭐ BEST
<br>
正答率 ${latest.rate}%
<br>
${latest.time}秒
`;

}

document.getElementById(
"bestRecord"
).innerHTML = bestHtml;

showTitleBest();

/* ミス一覧 */

const missArea =
document.getElementById(
"mistakes"
);

if(
mistakes.length===0
){

missArea.innerHTML =
"<b>🎉 全問正解！</b>";

}else{

missArea.innerHTML =
"<h3>間違えた問題</h3>";

mistakes.forEach(m=>{

missArea.innerHTML +=

`
<hr>
<b>${m.id}</b><br>
あなた：${m.your}<br>
正解：${m.correct}
`;

});

}

}

hintBtn.onclick = ()=>{

const q =
questions[current];

hintBox.style.display =
"block";

hintBox.textContent =
q.hint;

};

startBtn.onclick =
startGame;

retryBtn.onclick =
startGame;

homeBtn.onclick = ()=>{

showTitleBest();

/* 全画面を一旦閉じる */

startScreen.classList.remove("active");
gameScreen.classList.remove("active");
resultScreen.classList.remove("active");

/* タイトルだけ開く */

startScreen.classList.add("active");

};


showTitleBest();

</script>

</body>
</html>
